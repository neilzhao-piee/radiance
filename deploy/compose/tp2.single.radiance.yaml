# Radiance fleet on .141 (Dell T5820, 2x Radeon AI PRO R9700, gfx1201, PCIe 3.0 x16/x16).
# Based on fork deploy/compose/tp2.radiance.yaml, trimmed to the one model we serve.
# Port 8080 + model id + API key mirror the old Strata endpoint, so LibreChat/harness
# providers keep working unchanged after the cutover.
#
#   RADIANCE_API_KEY=x radiance --config /etc/radiance/radiance.yaml --check
server:
  host: "::"
  port: 8080
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 160
scheduler:
  load-timeout: 600s
models:
  # Qwen3.8-Flash-Next (IQR-V4 experts, int8 trunk, MTP, vision) on both cards.
  # Experts that do not fit the cards sit in a pinned host pool of 16 GiB (8 per rank).
  # Entry name = old Strata model id for client compatibility.
  #
  # max-num-seqs 2 / max-model-len 65536: measured on this rig (2026-11-24).
  #   The dual-sequence KV pool is 1.14 GiB, which covers 2 sequences at 65536 in
  #   full -- nothing spills to host memory. Throughput keeps rising with context
  #   and plateaus around 48k-64k: single-stream prefill 5.4-5.7k t/s, decode
  #   190 -> 213 t/s (1k -> 48k), dual-seq aggregate 260-305 t/s. At 131072 the
  #   pool needs about 4.6 GiB and decode falls to ~166 t/s, so 64k is the sweet
  #   spot. Longer requests are refused with HTTP 400, which keeps the KV cache
  #   fully covered instead of letting it spill into host memory.
  #   Host tuning: CPU governor must be performance (systemd unit cpu-perf.service).
  qwen3.8-flash-next-unsloth-ud-q4_k_xl:
    model: /models/qwen3.8-next-flash-iqr-v4.rad
    tp: 2
    tp-wire: wht6
    max-num-seqs: 2
    max-model-len: 65536
    placement: expert_tiered
    host-pool-mib: 16384
    kv-cache-dtype: i8
    prefix-cache-mib: 1024
    num-speculative-tokens: 3
    max-num-batched-tokens: 2048
